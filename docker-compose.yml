# DeceiveNet local stack: API + data stores. Honeypot containers are managed by the Honeypot Manager (Docker socket on host).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deceivenet
      POSTGRES_PASSWORD: deceivenet
      POSTGRES_DB: deceivenet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deceivenet -d deceivenet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: deceivenet
      RABBITMQ_DEFAULT_PASS: deceivenet

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: deceivenet
      MINIO_ROOT_PASSWORD: deceivenet_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
